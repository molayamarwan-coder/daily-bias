name: Calendar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python calendar.py
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
      - run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add calendar.json
          git commit -m "update calendar" || echo "no changes"
          git pull --rebase
          git push
