name: Daily Bias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 6-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bias
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python bias.py
      - run: python extras.py
      - run: |
          git config user.name "bias-bot"
          git config user.email "bias-bot@users.noreply.github.com"
          git add data.json history.json translations.json
          git commit -m "update bias" || echo "no changes"
          git pull --rebase
          git push
