name: Test Calendar

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python test_actual.py
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
